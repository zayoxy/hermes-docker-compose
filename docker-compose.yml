# =============================================================================
# Hermes Agent Docker Compose Stack
# =============================================================================
#
# Quick start:
#   docker compose up -d
#   docker compose exec ollama ollama pull gpt-oss:20b
#   docker compose exec gateway hermes setup
#
# Environment (.env file in same directory):
#   HERMES_DATA_DIR         - Host path for hermes data (default: ~/.hermes)
#   GATEWAY_PORT            - Host port for the gateway API (default: 8642)
#   DASHBOARD_PORT          - Host port for the dashboard UI (default: 9120)
#   DASHBOARD_AUTH_USERNAME - Dashboard login username
#   DASHBOARD_AUTH_PASSWORD - Dashboard login password
#   DASHBOARD_AUTH_SECRET   - Session signing secret (keep stable across restarts)
#   OLLAMA_DATA_DIR         - Host path for Ollama models (default: ~/.ollama)
#   OLLAMA_PORT             - Host port for the Ollama API (default: 11434)
#   OLLAMA_CONTEXT_LENGTH   - Default model context window (default: 65536)
#   OLLAMA_KEEP_ALIVE       - How long to keep a model loaded (default: 30m)
# =============================================================================

services:
  # ---------------------------------------------------------------------------
  # Hermes Gateway — core agent runtime & API
  # ---------------------------------------------------------------------------
  gateway:
    image: nousresearch/hermes-agent:latest
    container_name: hermes-gateway
    command: gateway run
    restart: unless-stopped
    ports:
      - "${GATEWAY_PORT:-8642}:8642"
    volumes:
      - ${HERMES_DATA_DIR:-${HOME:-/root}/.hermes}:/opt/data
    shm_size: 4g
    networks:
      - hermes-net
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8642/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # ---------------------------------------------------------------------------
  # Hermes Dashboard — web UI for managing the agent
  # ---------------------------------------------------------------------------
  dashboard:
    image: nousresearch/hermes-agent:latest
    container_name: hermes-dashboard
    command: dashboard --host 0.0.0.0
    restart: unless-stopped
    depends_on:
      - gateway
    ports:
      - "${DASHBOARD_PORT:-9120}:9119"
    volumes:
      - ${HERMES_DATA_DIR:-${HOME:-/root}/.hermes}:/opt/data
    environment:
      GATEWAY_HEALTH_URL: http://hermes-gateway:8642
      HERMES_DASHBOARD_BASIC_AUTH_USERNAME: "${DASHBOARD_AUTH_USERNAME:?set DASHBOARD_AUTH_USERNAME in .env}"
      HERMES_DASHBOARD_BASIC_AUTH_PASSWORD: "${DASHBOARD_AUTH_PASSWORD:?set DASHBOARD_AUTH_PASSWORD in .env}"
      HERMES_DASHBOARD_BASIC_AUTH_SECRET: "${DASHBOARD_AUTH_SECRET:?set DASHBOARD_AUTH_SECRET in .env}"
    networks:
      - hermes-net

  # ---------------------------------------------------------------------------
  # Ollama — local model inference server (OpenAI-compatible API)
  # ---------------------------------------------------------------------------
  # Hermes reaches this service internally at http://ollama:11434/v1.
  # The published port is bound to loopback because Ollama has no auth.
  # GPU access uses CDI: Docker Engine 28.3+ or Podman with a generated
  # /etc/cdi/nvidia.yaml. Remove the devices line to run on CPU only.
  ollama:
    image: docker.io/ollama/ollama:latest
    container_name: hermes-ollama
    restart: unless-stopped
    ports:
      - "127.0.0.1:${OLLAMA_PORT:-11434}:11434"
    volumes:
      - ${OLLAMA_DATA_DIR:-${HOME:-/root}/.ollama}:/root/.ollama
    environment:
      OLLAMA_HOST: "0.0.0.0:11434"
      OLLAMA_CONTEXT_LENGTH: "${OLLAMA_CONTEXT_LENGTH:-65536}"
      OLLAMA_KEEP_ALIVE: "${OLLAMA_KEEP_ALIVE:-30m}"
      OLLAMA_NUM_PARALLEL: "1"
      OLLAMA_MAX_LOADED_MODELS: "1"
      OLLAMA_FLASH_ATTENTION: "1"
      OLLAMA_KV_CACHE_TYPE: "q8_0"
    networks:
      - hermes-net
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    devices:
      - nvidia.com/gpu=all

# ---------------------------------------------------------------------------
# Watchtower (opt-in) — auto-update hermes containers
# ---------------------------------------------------------------------------
# Uncomment the block below to enable automatic image updates via Watchtower.
# It will watch every container on this compose project and pull new images
# when available, then restart them seamlessly.
#
# watchtower:
#   image: containrrr/watchtower:latest
#   container_name: hermes-watchtower
#   restart: unless-stopped
#   command: --label-enable --cleanup
#   volumes:
#     - /var/run/docker.sock:/var/run/docker.sock
#   networks:
#     - hermes-net

networks:
  hermes-net:
    driver: bridge
